name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Allow this workflow to push packages (GHCR) when a token is provided
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit sha
        id: get_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (if configured)
        run: npm run typecheck --if-present

      - name: Run tests (if any)
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ github.repository }}
          TAG=${{ needs.build.outputs.commit_sha }}
          docker build -t $IMAGE_NAME:$TAG .

      - name: Save Docker image to tar
        run: |
          IMAGE_NAME=${{ github.repository }}
          TAG=${{ needs.build.outputs.commit_sha }}
          docker save $IMAGE_NAME:$TAG -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

      - name: Log in to GitHub Container Registry (optional)
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push image to GHCR (optional)
        if: ${{ secrets.GHCR_TOKEN != '' }}
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TAG=${{ needs.build.outputs.commit_sha }}
          IMAGE=ghcr.io/$OWNER/$REPO:$TAG
          docker tag ${{ github.repository }}:$TAG $IMAGE
          docker push $IMAGE
